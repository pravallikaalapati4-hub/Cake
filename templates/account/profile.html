{% extends "base.html" %}
{% block title %}My Profile{% endblock %}
{% block content %}
<section class="section" style="padding-top:2rem;">
  <div class="container" style="max-width:560px;">
    <h1 class="section-title">My Profile</h1>
    <div style="background:var(--white);padding:2rem;border-radius:var(--radius-md);box-shadow:var(--shadow-md);">
      <form method="POST">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="name" class="form-control" value="{{ current_user.name }}" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" class="form-control" value="{{ current_user.email }}" disabled>
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" name="phone" class="form-control" value="{{ current_user.phone or '' }}">
        </div>
        <div class="form-group">
          <label>Address</label>
          <textarea name="address" class="form-control" rows="3">{{ current_user.address or '' }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Update Profile</button>
      </form>
      <div style="margin-top:1.5rem;display:flex;gap:1rem;flex-wrap:wrap;">
        <a href="{{ url_for('order.my_orders') }}" class="btn btn-outline btn-sm">My Orders</a>
        <a href="{{ url_for('product.wishlist') }}" class="btn btn-outline btn-sm">Wishlist</a>
        <a href="{{ url_for('auth.logout') }}" class="btn btn-sm" style="background:var(--gray-100);">Logout</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
