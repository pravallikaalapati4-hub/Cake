{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <h1>Welcome Back</h1>
    <p class="subtitle">Sign in to continue your dessert journey</p>
    <form method="POST">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" class="form-control" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="password-wrap">
          <input type="password" name="password" class="form-control" required placeholder="••••••••">
          <button type="button" class="toggle-pw">👁️</button>
        </div>
      </div>
      <div class="form-group" style="display:flex;align-items:center;gap:0.5rem;">
        <input type="checkbox" name="remember" id="remember">
        <label for="remember" style="margin:0;">Remember me</label>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>
    <p class="auth-footer">Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a></p>
    <p class="auth-footer" style="margin-top:0.5rem;font-size:0.8rem;opacity:0.7;">
      Demo: customer@cokebake.com / customer123<br>
      Admin: admin@cokebake.com / admin123
    </p>
  </div>
</div>
{% endblock %}
