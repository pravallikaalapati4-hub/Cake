{% extends "admin/base_admin.html" %}
{% block title %}{{ 'Edit' if product else 'Add' }} Product{% endblock %}
{% block content %}
<h1 style="margin-bottom:1.5rem;">{{ 'Edit' if product else 'Add' }} Product</h1>
<div style="background:var(--white);padding:2rem;border-radius:var(--radius-md);box-shadow:var(--shadow-sm);max-width:640px;">
  <form method="POST">
    <div class="form-group">
      <label>Name *</label>
      <input type="text" name="name" class="form-control" value="{{ product.name if product else '' }}" required>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea name="description" class="form-control" rows="3">{{ product.description if product else '' }}</textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Price (₹) *</label>
        <input type="number" name="price" class="form-control" step="0.01" value="{{ product.price if product else '' }}" required>
      </div>
      <div class="form-group">
        <label>Category *</label>
        <select name="category_id" class="form-control" required>
          {% for c in categories %}
          <option value="{{ c.id }}" {{ 'selected' if product and product.category_id == c.id }}>{{ c.name }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Ingredients</label>
      <input type="text" name="ingredients" class="form-control" value="{{ product.ingredients if product else '' }}">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Stock</label>
        <input type="number" name="stock" class="form-control" value="{{ product.stock if product else 50 }}">
      </div>
      <div class="form-group">
        <label>Rating</label>
        <input type="number" name="rating" class="form-control" step="0.1" min="1" max="5" value="{{ product.rating if product else 4.5 }}">
      </div>
    </div>
    <div class="form-group">
      <label>Image path (relative to static/images/)</label>
      <input type="text" name="image" class="form-control" value="{{ product.image if product else 'placeholder.jpg' }}" placeholder="cupcakes/classic-coke.jpg">
    </div>
    <button type="submit" class="btn btn-primary">{{ 'Update' if product else 'Add' }} Product</button>
    <a href="{{ url_for('admin.products') }}" class="btn btn-outline" style="margin-left:0.5rem;">Cancel</a>
  </form>
</div>
{% endblock %}
