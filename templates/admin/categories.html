{% extends "admin/base_admin.html" %}
{% block title %}Categories{% endblock %}
{% block content %}
<h1 style="margin-bottom:1.5rem;">Categories</h1>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;" class="cat-admin">
  <div style="background:var(--white);padding:1.5rem;border-radius:var(--radius-md);box-shadow:var(--shadow-sm);">
    <h3 style="margin-bottom:1rem;">Add Category</h3>
    <form method="POST" action="{{ url_for('admin.add_category') }}">
      <div class="form-group">
        <label>Name</label>
        <input type="text" name="name" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Description</label>
        <input type="text" name="description" class="form-control">
      </div>
      <button type="submit" class="btn btn-primary btn-sm">Add</button>
    </form>
  </div>
  <div>
    <table class="admin-table">
      <thead><tr><th>Name</th><th>Products</th><th>Actions</th></tr></thead>
      <tbody>
        {% for c in categories %}
        <tr>
          <td>{{ c.name }}</td>
          <td>{{ c.products.count() }}</td>
          <td>
            <form action="{{ url_for('admin.delete_category', cat_id=c.id) }}" method="POST" style="display:inline;" onsubmit="return confirm('Delete?')">
              <button type="submit" class="btn btn-sm" style="background:#FFEBEE;color:var(--danger);">Delete</button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
<style>@media(max-width:768px){.cat-admin{grid-template-columns:1fr!important;}}</style>
{% endblock %}
